name: Build Release Artifacts (Private Download Only)

on:
  workflow_dispatch:
    inputs:
      comment:
        description: 'Optionaler Hinweis/Versionstag für diesen Build'
        required: false
        default: 'Manual Build'

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm' # ggf. durch 'npm' oder 'yarn' ersetzen

      # Erforderliche System-Abhängigkeiten für Linux Build
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Dependencies
        run: pnpm install # ggf. an deinen Package Manager anpassen

      - name: Build Tauri Application
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: '' # Deaktiviert die Signierung, falls nicht benötigt

      - name: Upload Artifacts for Download
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          retention-days: 7 # Wie lange der Download in GitHub verfügbar bleibt (1-90 Tage)
