name: Build Release Artifacts (Private Download Only)

on:
  workflow_dispatch:
    inputs:
      comment:
        description: 'Optionaler Hinweis/Versionstag für diesen Build'
        required: false
        default: 'Manual Build'

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # macOS: FFmpeg + Clang macOS SDK-Sysroot & Header-Pfade setzen
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ffmpeg pkg-config
          
          SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
          FFMPEG_PREFIX=$(brew --prefix ffmpeg)
          
          echo "FFMPEG_DIR=$FFMPEG_PREFIX" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$FFMPEG_PREFIX/lib/pkgconfig:/opt/homebrew/lib/pkgconfig" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $SDK_PATH -I$FFMPEG_PREFIX/include -I/opt/homebrew/include" >> $GITHUB_ENV

      # Linux: WebKit, GTK, Clang und FFmpeg-Entwickler-Header
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            clang \
            llvm-dev \
            libclang-dev \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavfilter-dev \
            libavdevice-dev

      # Windows: FFmpeg Shared Shared/Dev Build herunterladen & Pfade setzen
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile "ffmpeg.zip"
          Expand-Archive ffmpeg.zip -DestinationPath "C:\ffmpeg"
          $ffmpegDir = Get-ChildItem -Path "C:\ffmpeg" -Directory | Select-Object -ExpandProperty FullName
          
          echo "FFMPEG_DIR=$ffmpegDir" >> $env:GITHUB_ENV
          echo "$ffmpegDir\bin" >> $env:GITHUB_PATH
          echo "LIB=$ffmpegDir\lib" >> $env:GITHUB_ENV
          echo "INCLUDE=$ffmpegDir\include" >> $env:GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Dependencies
        run: pnpm install

      - name: Build Tauri Application
        working-directory: apps/desktop
        run: pnpm exec tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: '' # Deaktiviert die Pflicht zur Code-Signierung

      - name: Upload Artifacts for Download
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          retention-days: 7
          
